
name: Mirror MCP Atlassian to Docker Hub

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read
  packages: read

jobs:
  mirror:
    name: Mirror GHCR to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Copy MCP Atlassian image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          skopeo copy --all \
            --dest-creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            docker://ghcr.io/sooperset/mcp-atlassian:0.24.1 \
            docker://docker.io/${DOCKERHUB_USERNAME}/mcp-atlassian:0.24.1

      - name: Verify Docker Hub image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          skopeo inspect \
            --creds "${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}" \
            docker://docker.io/${DOCKERHUB_USERNAME}/mcp-atlassian:0.24.1

